name: Check the application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test the catalog and chatbot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Check the API and pricing
        run: python -m pytest -q tests chatbot/tests
      - name: Build the standalone page
        run: python scripts/export_catalog.py
      - name: Check browser interactions
        run: npm test
